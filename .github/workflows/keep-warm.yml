name: keep-warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PolyCompile health repeatedly for ~4 minutes
        run: |
          for i in 1 2 3 4 5; do
            curl -s -m 30 https://polycompile-pro.onrender.com/api/v1/health || true
            if [ "$i" -lt 5 ]; then sleep 60; fi
          done
